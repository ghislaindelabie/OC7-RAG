version: '3.8'

services:
  api:
    build: .
    image: oc7-rag-api:latest
    container_name: oc7-rag-api
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - AUTO_REBUILD_INDEX=true
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # Extended for auto-rebuild on first start
