version: '3.8'

services:
  api:
    # Pull pre-built image from GitHub Container Registry
    image: ghcr.io/ghislaindelabie/oc7-rag:latest
    container_name: oc7-rag-api
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - AUTO_REBUILD_INDEX=true
    env_file:
      - .env
    restart: unless-stopped
    # Persistent volume for data (survives container restarts)
    volumes:
      - oc7-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # Extended for auto-rebuild on first start

volumes:
  oc7-data:

# Usage on server:
# 1. docker compose -f docker-compose.prod.yml pull
# 2. docker compose -f docker-compose.prod.yml up -d
# 3. docker compose -f docker-compose.prod.yml logs -f
