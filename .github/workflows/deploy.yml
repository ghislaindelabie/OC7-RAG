name: Deploy to Hetzner Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # First, run tests to ensure code quality
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx fastapi uvicorn pydantic

      - name: Run tests
        run: |
          pytest tests/test_api.py -v

  # Deploy only if tests pass
  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: success()  # Only deploy if tests passed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy using core script
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEPLOY_DIR: "~/oc7-rag"
        run: |
          # Use the SAME deploy script as manual deployment
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      - name: Create deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.HETZNER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** http://${{ secrets.HETZNER_HOST }}:8000" >> $GITHUB_STEP_SUMMARY
          echo "**Docs:** http://${{ secrets.HETZNER_HOST }}:8000/docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details" >> $GITHUB_STEP_SUMMARY
