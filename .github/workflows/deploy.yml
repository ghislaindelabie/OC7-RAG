name: Docker Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Required for pushing to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  # First, run tests to ensure code quality
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/test_api.py -v

  # Build Docker image and push to GHCR
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oc7-rag
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to server using Docker
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Docker container
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_DIR: "~/oc7-rag-docker"
        run: |
          # Copy docker-compose.prod.yml to server
          scp docker-compose.prod.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/

          # Deploy on server
          ssh $DEPLOY_USER@$DEPLOY_HOST bash << ENDSSH
          set -e
          cd $DEPLOY_DIR

          # Create .env file
          cat > .env << EOF
          MISTRAL_API_KEY=$MISTRAL_API_KEY
          EOF

          # Login to GHCR (if needed for private repos)
          echo "$GITHUB_TOKEN" | sg docker "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"

          # Pull latest image
          sg docker "docker compose -f docker-compose.prod.yml pull"

          # Stop and remove old container
          sg docker "docker compose -f docker-compose.prod.yml down" || true

          # Start new container
          sg docker "docker compose -f docker-compose.prod.yml up -d"

          # Wait for health check
          echo "Waiting for API to be healthy..."
          sleep 10

          # Verify deployment
          if curl -sf http://localhost:8000/health > /dev/null; then
            echo "✓ Deployment successful"
            curl -s http://localhost:8000/health | python3 -m json.tool
          else
            echo "✗ Deployment failed - API not responding"
            sg docker "docker compose -f docker-compose.prod.yml logs --tail=50"
            exit 1
          fi
          ENDSSH

      - name: Create deployment summary
        if: success()
        run: |
          echo "## ✅ Docker Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.HETZNER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository_owner }}/oc7-rag:latest" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** http://${{ secrets.HETZNER_HOST }}:8000" >> $GITHUB_STEP_SUMMARY
          echo "**Docs:** http://${{ secrets.HETZNER_HOST }}:8000/docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details" >> $GITHUB_STEP_SUMMARY
